# @format

name: Publish to PyPI
on: [push]

permissions:
  contents: read

env:
  POETRY_VERSION: '2.5.1'
  TWINE_VERSION: '7.0.0'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies using Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==$POETRY_VERSION"
          poetry check --lock
          poetry install --no-interaction
      - name: Test with pytest
        run: poetry run pytest

  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install "poetry==$POETRY_VERSION" "twine==$TWINE_VERSION"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(poetry version --short)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME must match package version v$version"
            exit 1
          fi
      - name: Build distribution with Poetry
        run: poetry build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI using Poetry
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$POETRY_PYPI_TOKEN_PYPI" ]; then
            echo "::error::PYPI_API_TOKEN is not configured"
            exit 1
          fi
          poetry publish --no-interaction
